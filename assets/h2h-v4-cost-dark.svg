<text x="40" y="526" font-size="11" font-weight="400" fill="#6e7681" text-anchor="start" >wise-men's full council is the slowest and dearest arm in the round: it chose its deep tier on three of the five questions, and its</text>
<text x="40" y="542" font-size="11" font-weight="400" fill="#6e7681" text-anchor="start" >synthesis check alone takes 9–11 minutes of every run. No council is faster or cheaper than a plain answer; what the minutes buy is</text>
<text x="40" y="558" font-size="11" font-weight="400" fill="#6e7681" text-anchor="start" >in the other three charts. Figures are stored in each raw answer's header; the transcripts they came from are local. RESULTS-V4.md.</text>
